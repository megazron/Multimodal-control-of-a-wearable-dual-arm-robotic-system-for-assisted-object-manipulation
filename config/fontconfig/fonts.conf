<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Helvetica is licensed and not installed here. Liberation Sans is
     metric-compatible with it, so text laid out for Helvetica keeps its
     line breaks and column widths. Nimbus Sans is the fallback if
     Liberation is ever absent.

     fontconfig already does this by its own metric aliasing, but relying on
     an implicit rule means a machine without it fails silently and the GUI
     just looks different. Stated explicitly, `fc-match Helvetica` is a check
     that can fail. -->
<fontconfig>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Nimbus Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
