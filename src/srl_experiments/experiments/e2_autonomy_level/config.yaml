# E2 - autonomy level. THE CORE COMPARISON. Within-subjects.
experiment: e2_autonomy_level
arm: left
conditions: [direct, shared, full_auto]
scenarios: [near_single, mid_single, far_single, near_pair]
repeats: 3
home_xyz: [-0.5195, 0.2138, 1.3928]
timeout_s: 45.0
counterbalance: williams   # balances position AND immediate sequence
block_minutes_max: 8       # fatigue cap, see docs/system/05_gravity_and_load.md
dwell_s: 0.4          # trial ends when the target is held this long
